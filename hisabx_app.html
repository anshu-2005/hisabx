        if (localStorage.getItem('hisabx_fintech_os_v1')) {
          localStorage.removeItem('hisabx_fintech_os_v1');
        }
        const saved = localStorage.getItem(DB_KEY);
        if (saved) {
          appState = JSON.parse(saved);
          if (!appState.upiSync) appState.upiSync = JSON.parse(JSON.stringify(defaultData.upiSync));
          if (!appState.dailyNotes) appState.dailyNotes = {};
          if (!appState.monthlyNotes) appState.monthlyNotes = [];
          if (!appState.transactions) appState.transactions = [];
          if (!appState.debts) appState.debts = [];
          if (!appState.people) appState.people = [];
          if (!appState.budgets) appState.budgets = [];
          if (!appState.reminders) appState.reminders = [];
          if (!appState.accounts || appState.accounts.length === 0) appState.accounts = JSON.parse(JSON.stringify(defaultData.accounts));
        } else {
          appState = JSON.parse(JSON.stringify(defaultData));
          saveState();
        }
      } catch (e) {
        console.error('Storage error, fallback to memory', e);
        appState = JSON.parse(JSON.stringify(defaultData));
      }
      recalculateAllBalances();
      updateRemindersBadge();
    }

    function saveState() {
      try {
        localStorage.setItem(DB_KEY, JSON.stringify(appState));
        if (typeof debounceSyncToCloud === 'function' && currentAuthToken) {
          debounceSyncToCloud();
        }
      } catch (e) {
        console.error('Save failed', e);
      }
    }

    // --- 2. FINANCIAL CALCULATIONS & LEDGER RULES ---
    function formatINR(num, showDecimals = true) {
      if (num === null || num === undefined || isNaN(num)) return '₹0.00';
      const isNegative = num < 0;
      const absVal = Math.abs(num);
      const formatted = new Intl.NumberFormat('en-IN', {
        style: 'currency',
        currency: 'INR',
        minimumFractionDigits: showDecimals ? 2 : 0,
        maximumFractionDigits: showDecimals ? 2 : 0
      }).format(absVal);
      return isNegative ? `-${formatted}` : formatted;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length === 3) {
        const d = new Date(parts[0], parts[1] - 1, parts[2]);
        return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
      }
      return dateStr;
    }

    function recalculateAllBalances() {
      // 1. Reset account balances to opening balance
      const accountBalances = {};
      appState.accounts.forEach(acc => {
        accountBalances[acc.id] = Math.round(acc.openingBalance * 100);
      });

      // 2. Loop over transactions to apply completed financial delta
      appState.transactions.forEach(tx => {
        if (tx.status !== 'COMPLETED') return; // Pending transactions never touch liquid balance
        const amtCents = Math.round(tx.amount * 100);

        if (tx.transactionType === 'INCOME') {
          const accId = tx.destinationAccountId || tx.sourceAccountId;
          if (accId && accountBalances[accId] !== undefined) accountBalances[accId] += amtCents;
        } else if (tx.transactionType === 'EXPENSE') {
          if (tx.sourceAccountId && accountBalances[tx.sourceAccountId] !== undefined) accountBalances[tx.sourceAccountId] -= amtCents;
        } else if (tx.transactionType === 'TRANSFER') {
          if (tx.sourceAccountId && accountBalances[tx.sourceAccountId] !== undefined) accountBalances[tx.sourceAccountId] -= amtCents;
          if (tx.destinationAccountId && accountBalances[tx.destinationAccountId] !== undefined) accountBalances[tx.destinationAccountId] += amtCents;
        } else if (tx.transactionType === 'MONEY_LENT') {
          if (tx.sourceAccountId && accountBalances[tx.sourceAccountId] !== undefined) accountBalances[tx.sourceAccountId] -= amtCents;
        } else if (tx.transactionType === 'MONEY_BORROWED') {
          const accId = tx.destinationAccountId || tx.sourceAccountId;
          if (accId && accountBalances[accId] !== undefined) accountBalances[accId] += amtCents;
        } else if (tx.transactionType === 'LOAN_REPAYMENT_GIVEN') {
          if (tx.sourceAccountId && accountBalances[tx.sourceAccountId] !== undefined) accountBalances[tx.sourceAccountId] -= amtCents;
        } else if (tx.transactionType === 'LOAN_REPAYMENT_RECEIVED') {
          const accId = tx.destinationAccountId || tx.sourceAccountId;
          if (accId && accountBalances[accId] !== undefined) accountBalances[accId] += amtCents;
        } else if (tx.transactionType === 'REFUND') {
          const accId = tx.destinationAccountId || tx.sourceAccountId;
          if (accId && accountBalances[accId] !== undefined) accountBalances[accId] += amtCents;
        } else if (tx.transactionType === 'ADJUSTMENT') {
          if (tx.sourceAccountId && accountBalances[tx.sourceAccountId] !== undefined) accountBalances[tx.sourceAccountId] += amtCents;
        }
      });

      // Store recalculated balances back
      appState.accounts.forEach(acc => {
        acc.currentBalance = (accountBalances[acc.id] || 0) / 100;
      });

      // Recalculate dynamic spent in budgets from actual completed transactions
      if (appState.budgets && Array.isArray(appState.budgets)) {
        appState.budgets.forEach(b => {
          b.spent = appState.transactions
            .filter(t => t.status === 'COMPLETED' && t.category === b.categoryName && (t.transactionType === 'EXPENSE' || t.transactionType === 'LOAN_REPAYMENT_GIVEN'))
            .reduce((sum, t) => sum + t.amount, 0);
        });
      }

      // Update badge counts in sidebar
      const txCountEl = document.getElementById('sidebar-tx-count');
      if (txCountEl) txCountEl.textContent = appState.transactions.length;
      const debtCountEl = document.getElementById('sidebar-debt-count');
      if (debtCountEl) debtCountEl.textContent = appState.debts.filter(d => d.status !== 'SETTLED').length;
      updateSidebarUserProfile();
    }

    function updateSidebarUserProfile() {
      if (!appState || !appState.profile) return;
      const nameEl = document.getElementById('sidebar-user-name');
      if (nameEl) nameEl.textContent = appState.profile.fullName || 'User Profile';
      const avatarEl = document.getElementById('sidebar-user-avatar');
      if (avatarEl) {
        const words = (appState.profile.fullName || 'User').trim().split(/\s+/);
        const initials = words.length > 1 ? (words[0][0] + words[1][0]).toUpperCase() : words[0].substring(0, 2).toUpperCase();
        avatarEl.textContent = initials || 'HX';
      }
    }

    function getDashboardMetrics() {
      let totalAvailableBalance = 0;
      appState.accounts.forEach(acc => {
        if (acc.isActive) totalAvailableBalance += acc.currentBalance;
      });

      let totalIncomeMonth = 0;
      let totalExpensesMonth = 0;

      // Filter by active target month prefix, or include all transactions if target month has none
      const now = new Date();
      const y = typeof calendarYear !== 'undefined' ? calendarYear : now.getFullYear();
      const m = typeof calendarMonth !== 'undefined' ? calendarMonth : now.getMonth();
      let targetMonthPrefix = `${y}-${String(m + 1).padStart(2, '0')}`;
      let hasMonthTx = appState.transactions.some(tx => tx.date && tx.date.startsWith(targetMonthPrefix));

      // If active target month has no tx, check if latest transaction has a month so user amounts always show
      if (!hasMonthTx && appState.transactions.length > 0 && appState.transactions[0].date) {
        targetMonthPrefix = appState.transactions[0].date.substring(0, 7);
        hasMonthTx = true;
      }

      appState.transactions.forEach(tx => {
        if (tx.status !== 'COMPLETED') return;
        const matchesMonth = hasMonthTx ? (tx.date && tx.date.startsWith(targetMonthPrefix)) : true;
        if (matchesMonth) {
          if (tx.transactionType === 'INCOME' || tx.transactionType === 'LOAN_REPAYMENT_RECEIVED') {
            totalIncomeMonth += tx.amount;
          } else if (tx.transactionType === 'EXPENSE' || tx.transactionType === 'LOAN_REPAYMENT_GIVEN') {
            totalExpensesMonth += tx.amount;
          } else if (tx.transactionType === 'REFUND') {
            totalExpensesMonth = Math.max(0, totalExpensesMonth - tx.amount);
          }
        }
      });

      let totalMoneyOwedToMe = 0; // Receivables
      let totalMoneyIOweOthers = 0; // Payables

      appState.debts.forEach(d => {
        if (d.status !== 'SETTLED') {
          if (d.type === 'LENT') totalMoneyOwedToMe += d.remainingAmount;
          else if (d.type === 'BORROWED') totalMoneyIOweOthers += d.remainingAmount;
        }
      });

      const netMonthlySavings = totalIncomeMonth - totalExpensesMonth;
      const savingsRate = totalIncomeMonth > 0 ? (netMonthlySavings / totalIncomeMonth) * 100 : 0;

      return {
        totalAvailableBalance,
        totalIncomeMonth,
        totalExpensesMonth,
        totalMoneyOwedToMe,
        totalMoneyIOweOthers,
        netMonthlySavings,
        savingsRate: Math.max(0, Math.round(savingsRate * 10) / 10),
        activeMonthPrefix: targetMonthPrefix
      };
    }

    // --- 3. TOAST & NOTIFICATION SYSTEM ---
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const toast = document.createElement('div');
      toast.className = `pointer-events-auto flex items-center space-x-2.5 px-4 py-3 rounded-xl shadow-lg border text-sm font-medium transition-all transform duration-200 animate-fadeIn ${
        type === 'success' 
          ? 'bg-emerald-50 dark:bg-emerald-950/90 text-emerald-800 dark:text-emerald-200 border-emerald-200 dark:border-emerald-800' 
          : type === 'error'
          ? 'bg-rose-50 dark:bg-rose-950/90 text-rose-800 dark:text-rose-200 border-rose-200 dark:border-rose-800'
          : 'bg-blue-50 dark:bg-blue-950/90 text-blue-800 dark:text-blue-200 border-blue-200 dark:border-blue-800'
      }`;

      const iconName = type === 'success' ? 'check-circle' : type === 'error' ? 'alert-circle' : 'info';
      toast.innerHTML = `
        <i data-lucide="${iconName}" class="w-4 h-4 shrink-0"></i>
        <span>${message}</span>
      `;
      container.appendChild(toast);
      lucide.createIcons();

      setTimeout(() => {
        toast.classList.add('opacity-0', 'scale-95');
        setTimeout(() => toast.remove(), 200);
      }, 3500);
    }

    // Chart Initializers (100% Dynamic from transactions ledger)
    function initIncomeExpenseChart() {
      const ctx = document.getElementById('chart-income-expense');
      if (!ctx) return;

      const monthMap = {};
      const monthNamesShort = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      
      const curYear = calendarYear || 2026;
      const curMonth = calendarMonth !== undefined ? calendarMonth : 9;
      for (let i = 3; i >= 0; i--) {
        let m = curMonth - i;
        let y = curYear;
        if (m < 0) { m += 12; y -= 1; }
        const key = `${y}-${String(m + 1).padStart(2, '0')}`;
        monthMap[key] = { label: `${monthNamesShort[m]} ${y}`, income: 0, expense: 0 };
      }

      appState.transactions.forEach(tx => {
        if (!tx.date) return;
        const prefix = tx.date.substring(0, 7);
        if (!monthMap[prefix]) {
          const parts = prefix.split('-');
          const y = parseInt(parts[0]);
          const m = parseInt(parts[1]) - 1;
          const label = (m >= 0 && m < 12) ? `${monthNamesShort[m]} ${y}` : prefix;
          monthMap[prefix] = { label, income: 0, expense: 0 };
        }
        if (tx.status === 'COMPLETED') {
          if (tx.transactionType === 'INCOME' || tx.transactionType === 'LOAN_REPAYMENT_RECEIVED') {
            monthMap[prefix].income += tx.amount;
          } else if (tx.transactionType === 'EXPENSE' || tx.transactionType === 'LOAN_REPAYMENT_GIVEN') {
            monthMap[prefix].expense += tx.amount;
          } else if (tx.transactionType === 'REFUND') {
            monthMap[prefix].expense = Math.max(0, monthMap[prefix].expense - tx.amount);
          }
        }
      });

      const sortedKeys = Object.keys(monthMap).sort();
      const displayKeys = sortedKeys.slice(-4);
      const labels = displayKeys.map(k => monthMap[k].label);
      const incomeData = displayKeys.map(k => monthMap[k].income);
      const expenseData = displayKeys.map(k => monthMap[k].expense);

      currentChartInstances['incomeExpense'] = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Income',
              data: incomeData,
              backgroundColor: '#10B981',
              borderRadius: 6
            },
            {
              label: 'Expenses',
              data: expenseData,
              backgroundColor: '#EF4444',
              borderRadius: 6
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { boxWidth: 12, font: { family: 'Inter', size: 11 } } },
            tooltip: {
              callbacks: {
                label: (ctx) => ` ${ctx.dataset.label}: ${formatINR(ctx.raw)}`
              }
            }
          },
          scales: {
            y: {
              ticks: {
                callback: (val) => `₹${val >= 1000 ? (val / 1000).toFixed(0) + 'k' : val}`,
                font: { family: 'Inter', size: 10 }
              },
              grid: { color: 'rgba(148, 163, 184, 0.1)' }
            },
            x: {
              grid: { display: false },
              ticks: { font: { family: 'Inter', size: 10 } }
            }
          }
        }
      });
    }

    function initCategoryPieChart() {
      const ctx = document.getElementById('chart-category-pie');
      if (!ctx) return;

      const categoryTotals = {};
      appState.transactions.forEach(t => {
        if (t.status === 'COMPLETED' && (t.transactionType === 'EXPENSE' || t.transactionType === 'LOAN_REPAYMENT_GIVEN')) {
          const cat = t.category || 'Other Expenses';
          categoryTotals[cat] = (categoryTotals[cat] || 0) + t.amount;
        }
      });

      const sortedCats = Object.keys(categoryTotals).sort((a, b) => categoryTotals[b] - categoryTotals[a]);
      const palette = ['#8B5CF6', '#EC4899', '#F97316', '#06B6D4', '#A855F7', '#EAB308', '#10B981', '#3B82F6', '#EF4444', '#64748B'];

      const hasExpenses = sortedCats.length > 0;
      const labels = hasExpenses ? sortedCats.slice(0, 6) : ['No Expenses Yet'];
      const data = hasExpenses ? sortedCats.slice(0, 6).map(c => categoryTotals[c]) : [1];
      const bgColors = hasExpenses ? palette.slice(0, labels.length) : ['#94A3B8'];

      currentChartInstances['categoryPie'] = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: data,
            backgroundColor: bgColors,
            borderWidth: 2,
            borderColor: document.documentElement.classList.contains('dark') ? '#0F172A' : '#FFFFFF'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '72%',
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (ctx) => hasExpenses ? ` ${ctx.label}: ${formatINR(ctx.raw)}` : ' No recorded expenses yet'
              }
            }
          }
        }
      });
    }

    function updateTxFilter(key, value) {
      txFilters[key] = value;

    function getFilteredTransactions() {
      let list = [...appState.transactions];

      // Search
      if (txFilters.search) {
        const q = txFilters.search.toLowerCase();
        list = list.filter(tx => 
          (tx.description && tx.description.toLowerCase().includes(q)) ||
          (tx.merchant && tx.merchant.toLowerCase().includes(q)) ||
          (tx.category && tx.category.toLowerCase().includes(q)) ||
          (tx.notes && tx.notes.toLowerCase().includes(q)) ||
          tx.amount.toString().includes(q)
        );
      }

      // Type
      if (txFilters.type !== 'ALL') {
        list = list.filter(tx => tx.transactionType === txFilters.type);
      }

      // Account
      if (txFilters.accountId !== 'ALL') {
        list = list.filter(tx => tx.sourceAccountId === txFilters.accountId || tx.destinationAccountId === txFilters.accountId);
      }

      // Category
      if (txFilters.category !== 'ALL') {
        list = list.filter(tx => tx.category === txFilters.category);
      }

      // Status
      if (txFilters.status !== 'ALL') {
        list = list.filter(tx => tx.status === txFilters.status);
      }

      // Date Presets
      const nowFilter = new Date();
      const todayFilterStr = nowFilter.toISOString().split('T')[0];
      const yestFilter = new Date(Date.now() - 86400000);
      const yesterdayFilterStr = yestFilter.toISOString().split('T')[0];
      const thisMonthPrefix = todayFilterStr.substring(0, 7);

      if (txFilters.datePreset === 'TODAY') {
        list = list.filter(tx => tx.date === todayFilterStr);
      } else if (txFilters.datePreset === 'YESTERDAY') {
        list = list.filter(tx => tx.date === yesterdayFilterStr);
      } else if (txFilters.datePreset === 'THIS_MONTH') {
        list = list.filter(tx => tx.date && tx.date.startsWith(thisMonthPrefix));
      }

      // Sort
      if (txFilters.sortBy === 'NEWEST') {
        list.sort((a, b) => new Date(b.date) - new Date(a.date));
      } else if (txFilters.sortBy === 'OLDEST') {
        list.sort((a, b) => new Date(a.date) - new Date(b.date));
      } else if (txFilters.sortBy === 'HIGHEST') {
        list.sort((a, b) => b.amount - a.amount);
      } else if (txFilters.sortBy === 'LOWEST') {
        list.sort((a, b) => a.amount - b.amount);
      }

      return list;
    }

          notes: r.notes || 'Settled via reminder',

        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        
        let dayInflow = 0;
        let dayOutflow = 0;
        let dayTxCount = 0;

        appState.transactions.forEach(t => {
          if (t.date === dateStr) {
            dayTxCount++;
            if (t.transactionType === 'INCOME' || t.transactionType === 'REFUND' || t.transactionType === 'LOAN_REPAYMENT_RECEIVED') {

    // --- 11B. UPI DIRECT AUTO-SYNC (PHONEPE / GPAY / PAYTM) HUB ---
    let parsedSmsObj = null;
    let isSyncingWebhook = false;

    // Automatic Client-Side Ingestion of Webhook Transactions from Server
    async function syncWebhookTransactions(manual = false) {
      if (isSyncingWebhook) return;
      isSyncingWebhook = true;
      try {
        const reqHeaders = {};
        if (currentAuthToken) {
          reqHeaders['Authorization'] = `Bearer ${currentAuthToken}`;
        }
        const res = await fetch('/api/webhook/transactions', { headers: reqHeaders });
        if (!res.ok) {
          if (manual) showToast('Could not reach webhook server endpoint', 'error');
          return;
        }
        const data = await res.json();
        if (!data || !Array.isArray(data.transactions)) return;

        let addedCount = 0;
        const existingRefOrId = new Set();
        appState.transactions.forEach(t => {
          if (t.referenceNumber) existingRefOrId.add(t.referenceNumber);
          if (t.id) existingRefOrId.add(t.id);
        });

        data.transactions.forEach(serverTx => {
          const isDuplicate = (serverTx.referenceNumber && existingRefOrId.has(serverTx.referenceNumber)) ||
                              existingRefOrId.has(serverTx.id);
          if (!isDuplicate) {
            appState.transactions.unshift({
              id: serverTx.id,
              transactionType: serverTx.transactionType,
              amount: serverTx.amount,
              date: serverTx.date,
              time: serverTx.time,
              status: serverTx.status || 'COMPLETED',
              category: serverTx.category,
              paymentMethod: 'UPI',
              sourceAccountId: serverTx.sourceAccountId,
              destinationAccountId: serverTx.destinationAccountId,
              merchant: serverTx.merchant,
              description: serverTx.description,
              referenceNumber: serverTx.referenceNumber,
              notes: serverTx.notes,
              tags: serverTx.tags || ['UPI', 'AutoWebhook']
            });
            existingRefOrId.add(serverTx.id);
            if (serverTx.referenceNumber) existingRefOrId.add(serverTx.referenceNumber);
            addedCount++;
          }
        });

        if (addedCount > 0) {
          recalculateAllBalances();
          saveState();
          if (activeView === 'dashboard') renderDashboardView(document.getElementById('main-content'));
          else if (activeView === 'transactions') renderTransactionsView(document.getElementById('main-content'));
          else if (activeView === 'upi-connect') renderUpiConnectView(document.getElementById('main-content'));
          showToast(`⚡ Auto-synced ${addedCount} new UPI transaction${addedCount === 1 ? '' : 's'} from Webhook!`, 'success');
        } else if (manual) {
          showToast('All UPI transactions are already synchronized.', 'info');
        }
      } catch (err) {
        if (manual) showToast('Sync failed: ' + err.message, 'error');
      } finally {
        isSyncingWebhook = false;
      }
    }

    function toggleUpiSyncMaster() {
      if (!appState.upiSync) {
        appState.upiSync = { enabled: false, apps: {}, webhookUrl: '/api/webhook/upi' };
      }
      appState.upiSync.enabled = !appState.upiSync.enabled;
      saveState();
      showToast(appState.upiSync.enabled ? '⚡ UPI Auto-Tracking Enabled! Webhook bridge active.' : '🛡️ UPI Auto-Sync Disabled. 100% manual mode active.', appState.upiSync.enabled ? 'success' : 'info');

    function applySmsTemplate(key) {
      const templates = {
        'phonepe_chai': 'PhonePe: Rs.350.00 debited from UPI for payment to Chai Point on 23-10-2026. Ref: 482910482910.',
        'gpay_grocery': 'Google Pay: Paid INR 1,450.00 to D-Mart Supermarket via UPI. HDFC Bank A/c XX4820 debited. UPI Ref: 9382103948.',
        'bank_credit': 'Credited! Your SBI A/c XX8291 is credited with INR 25,000.00 on 23-Oct-26 via UPI from Client Tech Retainer. Bal: INR 77,800.00.',
        'paytm_petrol': 'Paytm: Paid Rs.600 to HPCL Petrol Pump via Paytm UPI. Transaction ID: 294819284918.'
      };

      const input = document.getElementById('sms-paste-input');
      if (input && templates[key]) {
        input.value = templates[key];
        parseSmsText(templates[key]);
      }
    }

    function parseSmsText(raw) {
      const preview = document.getElementById('sms-parsed-preview');
      if (!preview) return;

      if (!raw || raw.trim().length < 8) {
        preview.classList.add('hidden');
        parsedSmsObj = null;
        return;
      }

      const text = raw.trim();
      const lower = text.toLowerCase();

      // Extract amount
      const amtMatch = text.match(/(?:rs\.?|inr|₹)\s*([\d,]+(?:\.\d{1,2})?)/i) || text.match(/([\d,]+(?:\.\d{1,2})?)\s*(?:rs|inr)/i);
      const amount = amtMatch ? parseFloat(amtMatch[1].replace(/,/g, '')) : 0;

      // Determine direction
      let type = 'EXPENSE';
      if (lower.includes('credit') || lower.includes('received') || lower.includes('deposited')) {
        type = 'INCOME';
      }

      // Determine merchant or person
      let merchant = 'UPI Payment';
      const toMatch = text.match(/(?:to|at|paid to)\s+([A-Za-z0-9\s&-]+?)(?:\s+on|\s+via|\s+ref|\.|$)/i);
      const fromMatch = text.match(/(?:from|by)\s+([A-Za-z0-9\s&-]+?)(?:\s+on|\s+via|\s+ref|\.|$)/i);
      if (type === 'INCOME' && fromMatch) {
        merchant = fromMatch[1].trim();
      } else if (toMatch) {
        merchant = toMatch[1].trim();
      }

      // Determine category
      let category = 'Other Expenses';
      if (type === 'INCOME') {
        category = lower.includes('salary') ? 'Salary' : 'Freelancing';
      } else if (lower.includes('chai') || lower.includes('swiggy') || lower.includes('zomato') || lower.includes('mart') || lower.includes('grocery') || lower.includes('food')) {
        category = 'Food & Groceries';
      } else if (lower.includes('petrol') || lower.includes('fuel') || lower.includes('uber') || lower.includes('ola') || lower.includes('metro')) {
        category = 'Travel & Commute';
      } else if (lower.includes('recharge') || lower.includes('bill') || lower.includes('wifi') || lower.includes('electricity')) {
        category = 'Bills & Utilities';
      } else if (lower.includes('amazon') || lower.includes('myntra') || lower.includes('shopping')) {
        category = 'Shopping & Apparel';
      }

      // Determine Account
      let account = appState.accounts.find(a => a.id === 'acc_upi') || appState.accounts[0];
      if (lower.includes('hdfc')) account = appState.accounts.find(a => a.id === 'acc_hdfc') || account;
      else if (lower.includes('sbi')) account = appState.accounts.find(a => a.id === 'acc_sbi') || account;

      parsedSmsObj = {
        transactionType: type,
        amount: amount,
        category: category,
        accountId: account.id,
        accountName: account.name,
        merchant: merchant,
        description: `${type === 'INCOME' ? 'Received via UPI' : 'UPI Payment to'} ${merchant}`,
        date: new Date().toISOString().split('T')[0],
        time: new Date().toTimeString().slice(0, 5),
        paymentMethod: 'UPI'
      };

      preview.classList.remove('hidden');
      preview.innerHTML = `
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-2">
            <span class="w-2.5 h-2.5 rounded-full ${type === 'INCOME' ? 'bg-emerald-500' : 'bg-rose-500'}"></span>
            <span class="font-bold text-xs uppercase tracking-wider text-slate-800 dark:text-slate-100">Live Parsed Transaction</span>
          </div>
          <span class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 font-bold text-[10px]">
            Ready to Sync
          </span>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
          <div>
            <span class="text-slate-400 block text-[10px]">Direction / Type</span>
            <strong class="${type === 'INCOME' ? 'text-emerald-600' : 'text-rose-600'}">${type}</strong>
          </div>
          <div>
            <span class="text-slate-400 block text-[10px]">Detected Amount</span>
            <strong class="text-sm ${type === 'INCOME' ? 'text-emerald-600' : 'text-rose-600'}">${formatINR(amount)}</strong>
          </div>
          <div>
            <span class="text-slate-400 block text-[10px]">Merchant / Recipient</span>
            <span class="font-bold text-slate-800 dark:text-white truncate block">${merchant}</span>
          </div>
          <div>
            <span class="text-slate-400 block text-[10px]">Linked Account</span>
            <span class="font-medium text-slate-700 dark:text-slate-300 truncate block">${account.name}</span>
          </div>

        paymentMethod: 'UPI',
        sourceAccountId: parsedSmsObj.transactionType === 'INCOME' ? undefined : parsedSmsObj.accountId,

        description: parsedSmsObj.description,
        notes: 'Auto-tracked via HisabX UPI Direct Reader',
        tags: ['UPIAutoSync', parsedSmsObj.category]
      };

      appState.transactions.unshift(newTx);

      const account = appState.accounts.find(a => a.id === 'acc_upi') || appState.accounts[0];

      const newTx = {
        id: `TX-SIM-${Date.now()}`,
        transactionType: type,
        amount: amount,
        date: new Date().toISOString().split('T')[0],
        time: new Date().toTimeString().slice(0, 5),
        status: 'COMPLETED',
        category: category,
        paymentMethod: 'UPI',
        sourceAccountId: type === 'INCOME' ? undefined : account.id,
        destinationAccountId: type === 'INCOME' ? account.id : undefined,
        merchant: merchant,
        description: `${appName}: ${merchant}`,
        notes: `Simulated live UPI webhook from ${appName}`,
        tags: ['UPIPushAlert', appName]
      };

      appState.transactions.unshift(newTx);
      recalculateAllBalances();
      saveState();
      closeModal();
      showToast(`⚡ Captured ${formatINR(amount)} from ${appName} into your ledger!`, 'success');

    function initReportCharts() {
      const catCtx = document.getElementById('chart-report-cat');
      if (catCtx) {
        const categoryTotals = {};
        appState.transactions.forEach(t => {
          if (t.status === 'COMPLETED' && (t.transactionType === 'EXPENSE' || t.transactionType === 'LOAN_REPAYMENT_GIVEN')) {
            const cat = t.category || 'Other Expenses';
            categoryTotals[cat] = (categoryTotals[cat] || 0) + t.amount;
          }
        });
        const sortedCats = Object.keys(categoryTotals).sort((a, b) => categoryTotals[b] - categoryTotals[a]);
        const palette = ['#8B5CF6', '#EC4899', '#F97316', '#06B6D4', '#A855F7', '#EAB308', '#10B981', '#3B82F6', '#EF4444', '#64748B'];
        const hasExpenses = sortedCats.length > 0;
        const labels = hasExpenses ? sortedCats.slice(0, 8) : ['No Expenses Yet'];
        const data = hasExpenses ? sortedCats.slice(0, 8).map(c => categoryTotals[c]) : [1];
        const colors = hasExpenses ? palette.slice(0, labels.length) : ['#94A3B8'];

        currentChartInstances['reportCat'] = new Chart(catCtx, {
          type: 'doughnut',
          data: {
            labels: labels,
            datasets: [{
              data: data,
              backgroundColor: colors
            }]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      }

      const accCtx = document.getElementById('chart-report-acc');
      if (accCtx) {
        currentChartInstances['reportAcc'] = new Chart(accCtx, {
          type: 'doughnut',
          data: {
            labels: appState.accounts.map(a => a.name),
            datasets: [{
              data: appState.accounts.map(a => Math.max(0, a.currentBalance)),
              backgroundColor: appState.accounts.map(a => a.color || '#1E3A8A')
            }]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      }
    }

    let parsedSmartObj = null;

    function applySmartPreset(text) {
      const input = document.getElementById('smart-input');
      if (input) {
        input.value = text;
        updateSmartPreview(text);
      }
    }

    function updateSmartPreview(text) {
      if (!text || !text.trim()) {
        parsedSmartObj = null;
        return;
      }

      const lower = text.toLowerCase().trim();
      // Extract amount
      const amtMatch = lower.match(/(?:₹|rs\.?|inr)?\s*(\d+(?:,\d+)*(?:\.\d+)?)/i);
      const amount = amtMatch ? parseFloat(amtMatch[1].replace(/,/g, '')) : 0;

      let type = 'EXPENSE';
      let personName = null;

      if (lower.includes('ko') && (lower.includes('diye') || lower.includes('diya') || lower.includes('lent'))) {
        type = 'MONEY_LENT';
        const m = lower.match(/(.+?)\s+ko/);
        if (m) personName = m[1].trim();
      } else if (lower.includes('se') && (lower.includes('liye') || lower.includes('liya') || lower.includes('borrowed'))) {
        type = 'MONEY_BORROWED';
        const m = lower.match(/(.+?)\s+se/);
        if (m) personName = m[1].trim();
      } else if (lower.includes('salary') || lower.includes('income') || lower.includes('received')) {
        type = 'INCOME';
      } else if (lower.includes('transfer')) {
        type = 'TRANSFER';
      }

      let category = 'Other Expenses';
      if (type === 'INCOME') category = 'Salary';
      else if (type === 'MONEY_LENT') category = 'Money Lent';
      else if (type === 'MONEY_BORROWED') category = 'Money Borrowed';
      else if (lower.includes('tea') || lower.includes('chai') || lower.includes('coffee') || lower.includes('swiggy') || lower.includes('dinner') || lower.includes('lunch')) category = 'Food & Groceries';
      else if (lower.includes('uber') || lower.includes('auto') || lower.includes('petrol') || lower.includes('cab')) category = 'Travel & Commute';
      else if (lower.includes('amazon') || lower.includes('shoes') || lower.includes('clothes')) category = 'Shopping & Apparel';
      else if (lower.includes('bill') || lower.includes('electricity') || lower.includes('wifi')) category = 'Bills & Utilities';

      let account = appState.accounts[0]; // default HDFC
      if (lower.includes('cash') || lower.includes('nakad')) account = appState.accounts.find(a => a.type === 'CASH') || account;
      else if (lower.includes('upi') || lower.includes('gpay') || lower.includes('paytm')) account = appState.accounts.find(a => a.type === 'UPI_WALLET') || account;
      else if (lower.includes('sbi')) account = appState.accounts.find(a => a.id === 'acc_sbi') || account;

      parsedSmartObj = {
        transactionType: type,
        amount: amount,
        category: category,
        accountId: account.id,
        accountName: account.name,
        personName: personName,
        description: text.trim()
      };

      const typeEl = document.getElementById('preview-type');
      const amtEl = document.getElementById('preview-amount');
      const catEl = document.getElementById('preview-category');
      const accEl = document.getElementById('preview-account');

      if (typeEl) typeEl.textContent = type.replace(/_/g, ' ');
      if (amtEl) {
        amtEl.textContent = formatINR(amount);
        amtEl.className = `text-sm font-bold ${type === 'INCOME' ? 'text-emerald-600' : 'text-rose-600'}`;
      }
      if (catEl) catEl.textContent = category;
      if (accEl) accEl.textContent = account.name;
    }

    function commitSmartEntry() {
      if (!parsedSmartObj || parsedSmartObj.amount <= 0) {
        showToast('Please specify a valid amount in your text entry', 'error');
        return;
      }

      const newTx = {
        id: `TX-2026-${String(appState.transactions.length + 1).padStart(3, '0')}`,
        transactionType: parsedSmartObj.transactionType,
        amount: parsedSmartObj.amount,
        date: new Date().toISOString().split('T')[0],
        time: new Date().toTimeString().slice(0, 5),
        status: 'COMPLETED',
        category: parsedSmartObj.category,
        paymentMethod: parsedSmartObj.accountId === 'acc_cash' ? 'CASH' : parsedSmartObj.accountId === 'acc_upi' ? 'UPI' : 'NET_BANKING',
        sourceAccountId: parsedSmartObj.transactionType === 'INCOME' ? undefined : parsedSmartObj.accountId,
        destinationAccountId: parsedSmartObj.transactionType === 'INCOME' ? parsedSmartObj.accountId : undefined,
        description: parsedSmartObj.description,
        notes: 'Recorded via HisabX Smart NLP Entry',
        tags: ['QuickAdd']
      };

      // If money lent or borrowed, link to a person
      if (parsedSmartObj.transactionType === 'MONEY_LENT') {
        let person = appState.people[0];
        if (!person) {
          person = { id: `per_${Date.now()}`, name: parsedSmartObj.merchant || 'Friend', phone: '' };
          appState.people.push(person);
        }
        newTx.personId = person.id;
        newTx.merchant = person.name;
        // create debt record
        appState.debts.unshift({
          id: `debt_${Date.now()}`,
          personId: person.id,
          type: 'LENT',
          initialAmount: parsedSmartObj.amount,
          remainingAmount: parsedSmartObj.amount,
          reason: parsedSmartObj.description,
          dueDate: new Date(Date.now() + 14 * 86400000).toISOString().split('T')[0],
          status: 'ACTIVE',
          date: new Date().toISOString().split('T')[0]
        });
      }

      appState.transactions.unshift(newTx);
      recalculateAllBalances();
      saveState();
      closeModal();
      showToast(`Recorded ${formatINR(newTx.amount)} (${newTx.description}) to ledger!`, 'success');
      navigateTo(activeView);
    }

    function handleRepaymentSubmit(e, personId, debtId) {
      e.preventDefault();
      const amt = parseFloat(document.getElementById('rp-amount').value);
      const accId = document.getElementById('rp-acc').value;

      const debt = appState.debts.find(d => d.id === debtId);
      const person = appState.people.find(p => p.id === personId);
      if (!debt || !person) return;

      const isRecovery = debt.type === 'LENT';

      // Deduct from debt
      debt.remainingAmount -= amt;
      if (debt.remainingAmount <= 0) {
        debt.remainingAmount = 0;
        debt.status = 'SETTLED';
      } else {
        debt.status = 'PARTIALLY_PAID';
      }

      // Add linked transaction
      const repayTx = {
        id: `TX-2026-${String(appState.transactions.length + 1).padStart(3, '0')}`,
        transactionType: isRecovery ? 'LOAN_REPAYMENT_RECEIVED' : 'LOAN_REPAYMENT_GIVEN',
        amount: amt,
        date: new Date().toISOString().split('T')[0],
        time: new Date().toTimeString().slice(0, 5),
        status: 'COMPLETED',
        category: isRecovery ? 'Loan Repayment Received' : 'Loan Repayment Given',
        paymentMethod: 'UPI',
        destinationAccountId: isRecovery ? accId : undefined,
        sourceAccountId: !isRecovery ? accId : undefined,
        personId: person.id,
        merchant: person.name,
        description: isRecovery ? `Loan Repayment received from ${person.name}` : `Repaid debt to ${person.name}`,
        notes: `Remaining balance: ${formatINR(debt.remainingAmount)}`,
        tags: ['Debt', 'Repayment']
      };

      appState.transactions.unshift(repayTx);
      recalculateAllBalances();
      saveState();
      closeModal();
      showToast(`Recorded repayment of ${formatINR(amt)}!`, 'success');
      navigateTo(activeView);
    }

    function exportTransactionsCSV() {
      let csv = 'ID,Date,Time,Type,Amount,Category,PaymentMethod,Description,Merchant,Status,Notes\n';
      appState.transactions.forEach(t => {
        const cleanDesc = (t.description || '').replace(/"/g, '""');
        const cleanMerchant = (t.merchant || '').replace(/"/g, '""');
        const cleanNotes = (t.notes || '').replace(/"/g, '""');
        csv += `"${t.id}","${t.date}","${t.time || ''}","${t.transactionType}",${t.amount},"${t.category || ''}","${t.paymentMethod}","${cleanDesc}","${cleanMerchant}","${t.status}","${cleanNotes}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', `hisabx_transactions_export_2026.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast('Downloaded transactions CSV', 'success');
    }

    // --- 19. SECURE AUTHENTICATION & MULTI-TENANT CLOUD SYNC ---
    const AUTH_TOKEN_KEY = 'hisabx_auth_jwt_token';
    let currentAuthUser = null;
    let currentAuthToken = localStorage.getItem(AUTH_TOKEN_KEY) || null;
    let syncDebounceTimer = null;

    async function initAuth() {
      currentAuthToken = localStorage.getItem(AUTH_TOKEN_KEY) || null;
      if (!currentAuthToken) {
        currentAuthUser = null;
        renderAuthUI();
        return;
      }

      try {
        const res = await fetch('/api/auth/me', {
          headers: { 'Authorization': `Bearer ${currentAuthToken}` }
        });
        if (res.ok) {
          const data = await res.json();
          currentAuthUser = data.user;
          renderAuthUI();
          await syncFromCloudServer(false);
        } else {
          currentAuthToken = null;
          currentAuthUser = null;
          localStorage.removeItem(AUTH_TOKEN_KEY);
          renderAuthUI();
        }
      } catch (err) {
        console.warn('Auth check offline or failed, continuing with cached state:', err.message);
        renderAuthUI();
      }
    }

                <input type="email" id="auth-login-email" required placeholder="you@example.com" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white font-medium text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none" />

              </div>
              <div>
                <label class="block text-slate-400 font-semibold mb-1">Email Address</label>
                <input type="email" id="auth-reg-email" required placeholder="you@example.com" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white font-medium text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none" />
              </div>
              <div>
                <label class="block text-slate-400 font-semibold mb-1">Password (min 6 characters)</label>
                <input type="password" id="auth-reg-password" required minlength="6" placeholder="Choose a strong password" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white font-medium text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none" />
              </div>
              <div class="pt-2">
                <button type="submit" id="btn-auth-reg-submit" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-700 hover:to-indigo-700 text-white font-bold text-xs shadow-md shadow-brand-500/20 active:scale-[0.98] transition-all">

              </div>
              <p class="text-[11px] text-slate-400 text-center pt-1">
                Already registered? <button type="button" onclick="switchAuthTab('login')" class="text-brand-600 dark:text-indigo-400 font-semibold hover:underline">Sign In</button>

            <!-- Forgot Password Form -->
            <form id="form-auth-forgot" onsubmit="handleForgotPassword(event)" class="space-y-3.5 text-xs hidden">
              <div>
                <h4 class="font-bold text-sm text-slate-800 dark:text-white mb-1">Reset Your Password</h4>
                <p class="text-xs text-slate-400">Enter your registered email to generate a secure password reset token.</p>
              </div>
              <div>
                <label class="block text-slate-400 font-semibold mb-1">Email Address</label>
                <input type="email" id="auth-forgot-email" required placeholder="you@example.com" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white font-medium text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none" />
              </div>
              <div class="pt-1">
                <button type="submit" class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs shadow-md transition-all">
                  Generate Reset Token
                </button>
              </div>
              <div id="reset-token-box" class="hidden p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 space-y-2">
                <p class="text-emerald-600 dark:text-emerald-400 font-semibold text-[11px]">Reset Token Generated:</p>
                <input type="text" id="auth-reset-token" readonly class="w-full px-2.5 py-1.5 rounded-lg bg-white dark:bg-slate-900 font-mono text-[11px] border border-slate-200 dark:border-slate-800 text-slate-800 dark:text-slate-200" />
                <div>
                  <label class="block text-slate-400 font-semibold mb-1">Enter New Password</label>
                  <input type="password" id="auth-new-password" minlength="6" placeholder="New password (min 6 characters)" class="w-full px-3 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs text-slate-900 dark:text-white" />
                </div>
                <button type="button" onclick="handleResetPassword()" class="w-full py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs">
                  Save New Password
                </button>
              </div>
              <p class="text-[11px] text-slate-400 text-center pt-1">
                <button type="button" onclick="switchAuthTab('login')" class="text-brand-600 dark:text-indigo-400 font-semibold hover:underline">&larr; Back to Sign In</button>

      lucide.createIcons();

    function switchAuthTab(tab) {
      const errBox = document.getElementById('auth-error-msg');
      if (errBox) errBox.classList.add('hidden');

      const loginTab = document.getElementById('tab-auth-login');
      const regTab = document.getElementById('tab-auth-register');
      const loginForm = document.getElementById('form-auth-login');
      const regForm = document.getElementById('form-auth-register');
      const forgotForm = document.getElementById('form-auth-forgot');

      if (tab === 'login') {
        loginTab?.classList.add('bg-brand-600', 'text-white');
        loginTab?.classList.remove('text-slate-500');
        regTab?.classList.remove('bg-brand-600', 'text-white');
        regTab?.classList.add('text-slate-500');
        loginForm?.classList.remove('hidden');
        regForm?.classList.add('hidden');
        forgotForm?.classList.add('hidden');
      } else if (tab === 'register') {
        regTab?.classList.add('bg-brand-600', 'text-white');
        regTab?.classList.remove('text-slate-500');
        loginTab?.classList.remove('bg-brand-600', 'text-white');
        loginTab?.classList.add('text-slate-500');
        regForm?.classList.remove('hidden');
        loginForm?.classList.add('hidden');
        forgotForm?.classList.add('hidden');
      } else if (tab === 'forgot') {
        loginTab?.classList.remove('bg-brand-600', 'text-white');
        loginTab?.classList.add('text-slate-500');
        regTab?.classList.remove('bg-brand-600', 'text-white');
        regTab?.classList.add('text-slate-500');
        forgotForm?.classList.remove('hidden');
        loginForm?.classList.add('hidden');
        regForm?.classList.add('hidden');
      }
    }

    async function handleAuthLogin(e) {
      e.preventDefault();
      const errBox = document.getElementById('auth-error-msg');
      const email = document.getElementById('auth-login-email').value.trim();
      const password = document.getElementById('auth-login-password').value;
      const submitBtn = document.getElementById('btn-auth-login-submit');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying credentials...';
      if (errBox) errBox.classList.add('hidden');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'Failed to sign in');
        }

        currentAuthToken = data.token;
        currentAuthUser = data.user;
        localStorage.setItem(AUTH_TOKEN_KEY, data.token);

        closeModal();
        renderAuthUI();
        showToast(`Welcome back, ${data.user.fullName || data.user.email}!`, 'success');

        const hasLocalData = appState.transactions && appState.transactions.length > 0;
        await syncFromCloudServer(false);

        if (hasLocalData) {
          promptSyncLocalDataToCloud();
        }
      } catch (err) {
        if (errBox) {
          errBox.textContent = err.message;
          errBox.classList.remove('hidden');
        }
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In to HisabX';
      }
    }

    async function handleAuthRegister(e) {
      e.preventDefault();
      const errBox = document.getElementById('auth-error-msg');
      const fullName = document.getElementById('auth-reg-name').value.trim();
      const email = document.getElementById('auth-reg-email').value.trim();
      const password = document.getElementById('auth-reg-password').value;
      const submitBtn = document.getElementById('btn-auth-reg-submit');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';
      if (errBox) errBox.classList.add('hidden');

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fullName, email, password })
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'Registration failed');
        }

        currentAuthToken = data.token;
        currentAuthUser = data.user;
        localStorage.setItem(AUTH_TOKEN_KEY, data.token);

        await syncToCloudServer(false);

        closeModal();
        renderAuthUI();
        showToast(`Welcome to HisabX, ${data.user.fullName}! Your account is ready.`, 'success');
        navigateTo('dashboard');
      } catch (err) {
        if (errBox) {
          errBox.textContent = err.message;
          errBox.classList.remove('hidden');
        }
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Free Account';
      }
    }

    async function handleAuthLogout() {
      if (currentAuthToken) {
        try {
          await fetch('/api/auth/logout', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${currentAuthToken}` }
          });
        } catch (e) {}
      }
      currentAuthToken = null;
      currentAuthUser = null;
      localStorage.removeItem(AUTH_TOKEN_KEY);
      renderAuthUI();
      showToast('You have been logged out securely', 'info');
      navigateTo('dashboard');
    }

    async function handleForgotPassword(e) {
      e.preventDefault();
      const email = document.getElementById('auth-forgot-email').value.trim();
      const errBox = document.getElementById('auth-error-msg');
      if (errBox) errBox.classList.add('hidden');

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (data.resetToken) {
          const box = document.getElementById('reset-token-box');
          const tokenInput = document.getElementById('auth-reset-token');
          if (box && tokenInput) {
            tokenInput.value = data.resetToken;
            box.classList.remove('hidden');
          }
          showToast('Reset token generated. Enter a new password below.', 'info');
        } else {
          showToast(data.message || 'Check your email for reset instructions', 'info');
        }
      } catch (err) {
        if (errBox) {
          errBox.textContent = err.message;
          errBox.classList.remove('hidden');
        }
      }
    }

    async function handleResetPassword() {
      const token = document.getElementById('auth-reset-token').value.trim();
      const newPassword = document.getElementById('auth-new-password').value;
      const errBox = document.getElementById('auth-error-msg');
      if (!newPassword || newPassword.length < 6) {
        if (errBox) {
          errBox.textContent = 'Password must be at least 6 characters long';
          errBox.classList.remove('hidden');
        }
        return;
      }

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Password update failed');
        showToast('Password updated! Please log in.', 'success');
        switchAuthTab('login');
      } catch (err) {
        if (errBox) {
          errBox.textContent = err.message;
          errBox.classList.remove('hidden');
        }
      }
    }

          <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl max-w-lg w-full p-6 space-y-4" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-3">
              <h3 class="font-bold text-base text-slate-900 dark:text-white flex items-center space-x-2">

                  Copy Personal Webhook URL

            <!-- Cloud Actions -->
            <div class="pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
              <button onclick="handleAuthLogout(); closeModal();" class="px-4 py-2 rounded-xl bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100 text-rose-600 dark:text-rose-400 font-semibold text-xs transition-colors">
                Sign Out
              </button>
              <div class="flex items-center space-x-2">
                <button onclick="syncToCloudServer(true)" class="px-4 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs transition-colors shadow-sm">
                  Sync All to Cloud Now
                </button>
              </div>

          </div>
        </div>

      lucide.createIcons();

    async function syncFromCloudServer(notify = false) {
      if (!currentAuthToken) return;
      try {
        const res = await fetch('/api/user/data', {
          headers: { 'Authorization': `Bearer ${currentAuthToken}` }
        });
        if (!res.ok) return;
        const result = await res.json();
        if (result && result.data) {
          const cloud = result.data;
          if (Array.isArray(cloud.accounts) && cloud.accounts.length > 0) {
            appState.accounts = cloud.accounts;
          }
          if (Array.isArray(cloud.transactions)) {
            appState.transactions = cloud.transactions;
          }
          if (Array.isArray(cloud.debts)) appState.debts = cloud.debts;
          if (Array.isArray(cloud.budgets)) appState.budgets = cloud.budgets;
          if (Array.isArray(cloud.reminders)) appState.reminders = cloud.reminders;
          if (cloud.dailyNotes) appState.dailyNotes = cloud.dailyNotes;
          if (Array.isArray(cloud.monthlyNotes)) appState.monthlyNotes = cloud.monthlyNotes;

          recalculateAllBalances();
          saveState();
          if (activeView === 'dashboard') renderDashboardView(document.getElementById('main-content'));
          else if (activeView === 'transactions') renderTransactionsView(document.getElementById('main-content'));
          else if (activeView === 'calendar') renderCalendarView(document.getElementById('main-content'));
          if (notify) showToast('Latest data pulled from cloud server!', 'success');
        }
      } catch (err) {
        if (notify) showToast('Cloud pull error: ' + err.message, 'error');
      }
    }

    async function syncToCloudServer(notify = false) {
      if (!currentAuthToken) return;
      try {
        const res = await fetch('/api/user/sync', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${currentAuthToken}`
          },
          body: JSON.stringify({
            accounts: appState.accounts,
            transactions: appState.transactions,
            debts: appState.debts,
            budgets: appState.budgets,
            reminders: appState.reminders,
            dailyNotes: appState.dailyNotes,
            monthlyNotes: appState.monthlyNotes
          })
        });
        const data = await res.json();
        if (res.ok && notify) {
          showToast('Data synchronized to secure cloud database!', 'success');
        }
      } catch (err) {
        if (notify) showToast('Cloud sync failed: ' + err.message, 'error');
      }
    }

    function debounceSyncToCloud() {
      if (!currentAuthToken) return;
      if (syncDebounceTimer) clearTimeout(syncDebounceTimer);
      syncDebounceTimer = setTimeout(() => {
        syncToCloudServer(false);
      }, 1500);
    }

    function promptSyncLocalDataToCloud() {
      const container = document.getElementById('modal-container');
      container.innerHTML = `
        <div class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fadeIn" onclick="if(event.target === this) closeModal()">
          <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl max-w-md w-full p-6 space-y-4" onclick="event.stopPropagation()">
            <div class="flex items-center space-x-3">
              <div class="w-10 h-10 rounded-2xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 flex items-center justify-center shrink-0">
                <i data-lucide="cloud-upload" class="w-5 h-5"></i>
              </div>
              <div>

                <p class="text-xs text-slate-400">We detected local transactions on this device.</p>
              </div>
            </div>
            <p class="text-xs text-slate-500 dark:text-slate-400">
              Would you like to safely upload and merge your local financial records into your authenticated HisabX account? Existing records will not be overwritten.
            </p>
            <div class="flex justify-end space-x-2 pt-2 border-t border-slate-100 dark:border-slate-800 text-xs">
              <button onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 font-semibold">

                Merge & Sync to Cloud
              </button>
            </div>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    // Boot
    window.addEventListener('DOMContentLoaded', async () => {
      loadState();
      await initAuth();
      navigateTo('dashboard');
      syncWebhookTransactions();
      setInterval(syncWebhookTransactions, 25000);
    });
  </script>
