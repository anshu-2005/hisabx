name: HisabX SaaS CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Run Automated Test Suites
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 18.x, 20.x, 22.x ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Run Webhook & Auth Isolation Test Suites
        run: npm test
        env:
          NODE_ENV: test
          PORT: 3000
          JWT_SECRET: ci_test_ultra_secret_key_minimum_32_chars_long!
          UPI_WEBHOOK_SECRET: whsec_test_mock_secret
